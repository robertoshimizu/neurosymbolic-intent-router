[project]
name = "statemachine-playground"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    "python-statemachine>=3.2.1",
    "sentence-transformers>=6.1.0",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: loads the sentence-transformers MiniLM model",
]
