[project]
name = "neurosymbolic-intent-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gliner2[local]>=2.0.0",
    "janus-swi>=1.5.3",
    "numpy>=2.4.6",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.3",
    "python-statemachine>=3.2.1",
    "sentence-transformers>=5.7.0,<6",
    "sentencepiece>=0.2.2",
    "text2num>=3.1.0",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]
experiments = [
    "instructor>=1.17.0",
    "openai>=3.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: loads the sentence-transformers MiniLM model",
    "ollama: structured-output experiment against a local Ollama model (slow)",
    "gliner: loads the GLiNER2.5 model (about 20 s on first load)",
    "prolog: needs SWI-Prolog; run with uv run --env-file .env",
]

[tool.pyright]
include = ["src", "tests", "experiments"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.uv]
default-groups = ["dev", "experiments"]
